services:
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
  backend:
    build: ./backend
    environment:
      PORT: 3000
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-phonemail.local}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://phonemail:phonemail@postgres:5432/phonemail}
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phonemail}
      POSTGRES_USER: ${POSTGRES_USER:-phonemail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phonemail}
    volumes: ["postgres-data:/var/lib/postgresql/data", "./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["1025:1025", "8025:8025"]
volumes:
  postgres-data:
