services:
  postgres:
    image: postgres:16-alpine
    container_name: phonemail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phonemail}
      POSTGRES_USER: ${POSTGRES_USER:-phonemail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phonemail_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phonemail} -d ${POSTGRES_DB:-phonemail}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - phonemail-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: phonemail-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - phonemail-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phonemail-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-phonemail}:${POSTGRES_PASSWORD:-phonemail_dev}@postgres:5432/${POSTGRES_DB:-phonemail}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    expose:
      - "3000"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - phonemail-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phonemail-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - phonemail-network

volumes:
  postgres_data:
    driver: local

networks:
  phonemail-network:
    driver: bridge
